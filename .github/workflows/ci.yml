name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: equijournal

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check formatting
        run: dotnet format --workspace --verify-no-changes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: ESLint
        working-directory: web
        run: npx ng lint

      - name: npm audit (web)
        working-directory: web
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (widget-loader)
        working-directory: widget-loader
        continue-on-error: true
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  build:
    name: Build
    needs: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: NuGet vulnerability audit
        continue-on-error: true
        run: |
          dotnet list package --vulnerable --include-transitive | tee nuget-audit.txt
          if grep -qi "has the following vulnerable packages"; then
            echo "::warning::Vulnerable NuGet packages reported — treat as the weekly patching backlog"
            exit 1
          fi
          echo "No vulnerable NuGet packages reported."

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Verify Domain has no EF/ASP.NET dependencies
        run: |
          dotnet build src/Equine.Domain/Equine.Domain.csproj --configuration Release
          # Check that no EF Core or ASP.NET packages are referenced
          if grep -q "EntityFrameworkCore" src/Equine.Domain/Equine.Domain.csproj; then
            echo "ERROR: Equine.Domain must not reference EF Core"
            exit 1
          fi
          if grep -q "Microsoft.AspNetCore" src/Equine.Domain/Equine.Domain.csproj; then
            echo "ERROR: Equine.Domain must not reference ASP.NET"
            exit 1
          fi
          echo "Domain isolation check passed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Generate API client
        working-directory: web
        run: npm run generate:api || echo "Skipped - no API running"

      - name: Verify API client is current
        working-directory: web
        run: |
          git diff --exit-code libs/api-client || {
            echo "::error::Generated API client is out of date. Run 'npm run generate:api' locally and commit the changes."
            exit 1
          }

      - name: Build Angular apps
        working-directory: web
        run: npm run build

      - name: Deliverability DNS check
        run: |
          DOMAIN="${{ vars.SENDING_DOMAIN }}"
          if [ -z "$DOMAIN" ] || echo "$DOMAIN" | grep -qiE 'localhost|\.local$'; then
            echo "Notifications:SendingDomain not set or localhost — skip"
            exit 0
          fi
          SPF=$(dig +short TXT "$DOMAIN" | tr -d '"' )
          DMARC=$(dig +short TXT "_dmarc.$DOMAIN" | tr -d '"' )
          echo "SPF=$SPF"
          echo "DMARC=$DMARC"
          echo "$SPF" | grep -qi "v=spf1" || { echo "::error::Missing or invalid SPF for $DOMAIN"; exit 1; }
          echo "$DMARC" | grep -qi "v=DMARC1" || { echo "::error::Missing or invalid DMARC for $DOMAIN"; exit 1; }

      - name: Build widget loader
        working-directory: widget-loader
        run: |
          npm ci
          npm run build
          npm run size

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test tests/Equine.UnitTests/Equine.UnitTests.csproj --configuration Release --no-build --verbosity normal

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run integration tests
        run: dotnet test tests/Equine.IntegrationTests/Equine.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  docker-build:
    name: Build Docker Image
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Replace with actual deployment commands (e.g., kubectl, kustomize, etc.)
          # kubectl apply -k deploy/staging/
          echo "Deployment complete."
