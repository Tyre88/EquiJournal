name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            widget-loader/package-lock.json

      - name: Verify C# formatting
        run: dotnet format --verify-no-changes

      - name: Restore and build .NET
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: Verify Domain has no EF/ASP.NET dependencies
        run: |
          if grep -q "EntityFrameworkCore" src/Equine.Domain/Equine.Domain.csproj; then
            echo "ERROR: Equine.Domain must not reference EF Core"
            exit 1
          fi
          if grep -q "Microsoft.AspNetCore" src/Equine.Domain/Equine.Domain.csproj; then
            echo "ERROR: Equine.Domain must not reference ASP.NET"
            exit 1
          fi
          echo "Domain isolation check passed."

      - name: Run unit tests
        run: dotnet test tests/Equine.UnitTests/Equine.UnitTests.csproj --configuration Release --verbosity normal

      - name: NuGet vulnerability audit
        continue-on-error: true
        run: |
          dotnet list package --vulnerable --include-transitive | tee nuget-audit.txt
          if grep -qi "has the following vulnerable packages"; then
            echo "::warning::Vulnerable NuGet packages reported — see Dependabot and docs/runbooks/patching.md"
            exit 1
          fi
          echo "No vulnerable NuGet packages reported."

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build Angular apps
        working-directory: web
        run: npm run build

      - name: Build widget loader
        working-directory: widget-loader
        run: |
          npm ci
          npm run build
          npm run size

  publish:
    name: Publish
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/equijournal
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
