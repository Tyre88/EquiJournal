# Dokploy Docker Swarm stack for equilog.ry.beebase.cloud
#
# In Dokploy, set the Compose type to Stack, point it at this file, and set env
# vars from .env.dokploy.example. The DNS A-record for equilog.ry.beebase.cloud
# must point at a Swarm manager.
#
# `docker stack deploy` ignores `build` and `depends_on`. Tag the API image
# before the first deploy and after each source change:
#   docker compose -f docker-compose.dokploy.yml build api
#
# Named volumes are node-local. MinIO, Mailpit, and the API data-protection
# keys are single-writer, so schedule those tasks on the same node (or point
# the volumes at shared storage) before relying on the second replica.
# The stack name comes from Dokploy (`docker stack deploy` rejects a top-level `name`).

services:
  api:
    image: equilog-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      # External Dokploy Postgres. A literal password so a leftover
      # POSTGRES_PASSWORD in the Dokploy UI cannot override the equi role.
      # Program.cs builds ConnectionStrings:Default from these parts.
      Postgres__Host: equijournal-production-lwqnp4
      Postgres__Port: "5432"
      Postgres__Database: equijurnal
      Postgres__Username: equi
      Postgres__Password: "6LVC8XClGXLfIqjRJR9c"
      Jwt__Issuer: ${JWT_ISSUER:-Equine.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-EquineClient}
      Jwt__SecurityKey: ${JWT_SECURITY_KEY:?set JWT_SECURITY_KEY}
      Admin__Email: ${ADMIN_EMAIL:-admin@equijournal.se}
      Admin__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      Admin__DisplayName: ${ADMIN_DISPLAY_NAME:-Admin}
      Cors__AllowedOrigins__0: https://${DOMAIN:-equilog.ry.beebase.cloud}
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      Storage__Bucket: ${STORAGE_BUCKET:-equine-attachments}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__From: ${SMTP_FROM:-bokning@${DOMAIN:-equilog.ry.beebase.cloud}}
      Smtp__FromName: ${SMTP_FROM_NAME:-HästJournal}
      Practitioner__Name: ${PRACTITIONER_NAME:-Victor}
      Practitioner__Clinic: ${PRACTITIONER_CLINIC:-HästJournal}
      Practitioner__Address: ${PRACTITIONER_ADDRESS:-Skåne, Sverige}
      Practitioner__Phone: ${PRACTITIONER_PHONE:-0700000000}
      Practitioner__Email: ${PRACTITIONER_EMAIL:-admin@equijournal.se}
      GoogleMaps__BrowserKey: ${GOOGLE_MAPS_BROWSER_KEY:-}
      Notifications__SendingDomain: ${NOTIFICATIONS_SENDING_DOMAIN:-}
    volumes:
      - api_logs:/app/logs
      - api_dataprotection:/root/.aspnet/DataProtection-Keys
    networks:
      - dokploy-network
      - internal
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.swarm.network=dokploy-network
        - traefik.http.routers.equilog.rule=Host(`${DOMAIN:-equilog.ry.beebase.cloud}`)
        - traefik.http.routers.equilog.entrypoints=websecure
        - traefik.http.routers.equilog.tls=true
        - traefik.http.routers.equilog.tls.certresolver=letsencrypt
        - traefik.http.services.equilog.loadbalancer.server.port=8080
        - traefik.http.middlewares.equilog-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.equilog-redirect.redirectscheme.permanent=true
        - traefik.http.routers.equilog-http.rule=Host(`${DOMAIN:-equilog.ry.beebase.cloud}`)
        - traefik.http.routers.equilog-http.entrypoints=web
        - traefik.http.routers.equilog-http.middlewares=equilog-redirect
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit_data:/data
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

  minio:
    # minio/minio is no longer published; coollabsio rebuilds official releases.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: chainguard/minio-client:latest-dev
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done &&
      mc mb -p local/${STORAGE_BUCKET:-equine-attachments} || true &&
      exit 0
      "
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s

networks:
  dokploy-network:
    external: true
  internal:
    driver: overlay
    attachable: true

volumes:
  minio_data:
  mailpit_data:
  api_logs:
  api_dataprotection:
