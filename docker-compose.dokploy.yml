# Dokploy + Traefik deployment for equilog.ry.beebase.cloud
#
# Deploy in Dokploy → Services → Compose, point at this file, set env vars from
# .env.dokploy.example, and ensure DNS A-record for equilog.ry.beebase.cloud
# points at the Dokploy host.
#
# Alternative: configure the domain in Dokploy's Domains tab instead of the
# Traefik labels below (then redeploy after any domain change).

name: equilog

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-password-sync:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      # Development is deliberate: the schema is created by EnsureCreatedAsync, which
      # only runs in the non-Production branch of EnsureDatabaseExists. There are no EF
      # migrations yet, so Production would start against an empty database.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-equijournal};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-Equine.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-EquineClient}
      Jwt__SecurityKey: ${JWT_SECURITY_KEY:?set JWT_SECURITY_KEY}
      Admin__Email: ${ADMIN_EMAIL:-admin@equijournal.se}
      Admin__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      Admin__DisplayName: ${ADMIN_DISPLAY_NAME:-Admin}
      Cors__AllowedOrigins__0: https://${DOMAIN:-equilog.ry.beebase.cloud}
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      Storage__Bucket: ${STORAGE_BUCKET:-equine-attachments}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__From: ${SMTP_FROM:-bokning@${DOMAIN:-equilog.ry.beebase.cloud}}
      Smtp__FromName: ${SMTP_FROM_NAME:-HästJournal}
      Practitioner__Name: ${PRACTITIONER_NAME:-Victor}
      Practitioner__Clinic: ${PRACTITIONER_CLINIC:-HästJournal}
      Practitioner__Address: ${PRACTITIONER_ADDRESS:-Skåne, Sverige}
      Practitioner__Phone: ${PRACTITIONER_PHONE:-0700000000}
      Practitioner__Email: ${PRACTITIONER_EMAIL:-admin@equijournal.se}
      GoogleMaps__BrowserKey: ${GOOGLE_MAPS_BROWSER_KEY:-}
      Notifications__SendingDomain: ${NOTIFICATIONS_SENDING_DOMAIN:-}
    volumes:
      - api_logs:/app/logs
      - api_dataprotection:/root/.aspnet/DataProtection-Keys
    expose:
      - "8080"
    networks:
      - dokploy-network
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.equilog.rule=Host(`${DOMAIN:-equilog.ry.beebase.cloud}`)"
      - "traefik.http.routers.equilog.entrypoints=websecure"
      - "traefik.http.routers.equilog.tls=true"
      - "traefik.http.routers.equilog.tls.certresolver=letsencrypt"
      - "traefik.http.services.equilog.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.equilog-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.equilog-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.equilog-http.rule=Host(`${DOMAIN:-equilog.ry.beebase.cloud}`)"
      - "traefik.http.routers.equilog-http.entrypoints=web"
      - "traefik.http.routers.equilog-http.middlewares=equilog-redirect"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_PASSWORD only takes effect when postgres_data is first initialized.
    # Rotating it afterwards leaves the cluster on the old password, which the API
    # reports as SqlState 28P01. postgres-password-sync below reconciles it on every
    # deploy -- see docs/runbooks/postgres-auth-failure.md.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equijournal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Shared so postgres-password-sync can reach the local socket, which the image's
      # pg_hba.conf trusts, even while TCP password auth is failing.
      - postgres_socket:/var/run/postgresql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-equijournal}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Makes POSTGRES_PASSWORD authoritative on every deploy, not just at initdb.
  # Connects over the trusted local socket, so it works even when the cluster still
  # holds an older password. Idempotent: setting the same password again is a no-op.
  postgres-password-sync:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-postgres}
      SYNC_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_socket:/var/run/postgresql
    # Needs a shell to expand SYNC_PASSWORD; psql's :'pw' does the SQL quoting, so
    # '+' and '/' from `openssl rand -base64` pass through intact.
    entrypoint:
      - /bin/sh
      - -c
      - >
        exec psql -h /var/run/postgresql -d postgres -v ON_ERROR_STOP=1
        -v pw="$$SYNC_PASSWORD"
        -c "ALTER USER CURRENT_USER WITH PASSWORD :'pw';"
    restart: "no"
    networks:
      - internal

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit_data:/data
    networks:
      - internal

  minio:
    # minio/minio is no longer published; coollabsio rebuilds official releases.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done &&
      mc mb -p local/${STORAGE_BUCKET:-equine-attachments} || true &&
      exit 0
      "
    networks:
      - internal

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
  postgres_socket:
  minio_data:
  mailpit_data:
  api_logs:
  api_dataprotection:
