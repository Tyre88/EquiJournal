# Dokploy + Traefik deployment for equilog.ry.beebase.cloud
#
# Deploy in Dokploy → Services → Compose, point at this file, set env vars from
# .env.dokploy.example, and ensure DNS A-record for equilog.ry.beebase.cloud
# points at the Dokploy host.
#
# Alternative: configure the domain in Dokploy's Domains tab instead of the
# Traefik labels below (then redeploy after any domain change).

name: equilog

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-equijournal};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-Equine.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-EquineClient}
      Jwt__SecurityKey: ${JWT_SECURITY_KEY:?set JWT_SECURITY_KEY}
      Admin__Email: ${ADMIN_EMAIL:-admin@equijournal.se}
      Admin__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      Admin__DisplayName: ${ADMIN_DISPLAY_NAME:-Admin}
      Cors__AllowedOrigins__0: https://${DOMAIN:-equilog.ry.beebase.cloud}
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      Storage__Bucket: ${STORAGE_BUCKET:-equine-attachments}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__From: ${SMTP_FROM:-bokning@${DOMAIN:-equilog.ry.beebase.cloud}}
      Smtp__FromName: ${SMTP_FROM_NAME:-HästJournal}
      Practitioner__Name: ${PRACTITIONER_NAME:-Victor}
      Practitioner__Clinic: ${PRACTITIONER_CLINIC:-HästJournal}
      Practitioner__Address: ${PRACTITIONER_ADDRESS:-Skåne, Sverige}
      Practitioner__Phone: ${PRACTITIONER_PHONE:-0700000000}
      Practitioner__Email: ${PRACTITIONER_EMAIL:-admin@equijournal.se}
      GoogleMaps__BrowserKey: ${GOOGLE_MAPS_BROWSER_KEY:-}
      Notifications__SendingDomain: ${NOTIFICATIONS_SENDING_DOMAIN:-}
    volumes:
      - api_logs:/app/logs
      - api_dataprotection:/root/.aspnet/DataProtection-Keys
    expose:
      - "8080"
    networks:
      - dokploy-network
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.equilog.rule=Host(`${DOMAIN:-equilog.ry.beebase.cloud}`)"
      - "traefik.http.routers.equilog.entrypoints=websecure"
      - "traefik.http.routers.equilog.tls=true"
      - "traefik.http.routers.equilog.tls.certresolver=letsencrypt"
      - "traefik.http.services.equilog.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.equilog-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.equilog-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.equilog-http.rule=Host(`${DOMAIN:-equilog.ry.beebase.cloud}`)"
      - "traefik.http.routers.equilog-http.entrypoints=web"
      - "traefik.http.routers.equilog-http.middlewares=equilog-redirect"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_PASSWORD is only read by initdb, the first time the
    # postgres_data volume is created. Rotating it in Dokploy therefore does
    # NOT change the password of an existing cluster: the API then presents
    # the new password to a server still holding the old one and dies with
    # SqlState 28P01 / auth_failed. See docs/runbooks/postgres-auth-failure.md
    #
    # This wrapper reconciles the role password with POSTGRES_PASSWORD on
    # every start, so the variable is authoritative rather than a one-shot.
    #
    # Why it is safe:
    #  * It runs inside this container, against the local unix socket, which
    #    the image's pg_hba.conf grants `trust` -- so it works even while TCP
    #    password auth is failing. No shared socket volume, no extra service.
    #  * It runs in the background and `exec`s the stock entrypoint regardless,
    #    so it CANNOT fail, block or slow down a deploy. Worst case it logs a
    #    failure and the cluster password stays exactly as it was.
    #  * It retries ALTER USER for about a minute. The healthcheck below does
    #    not pass until a TCP login with POSTGRES_PASSWORD succeeds, so api
    #    waits instead of crash-looping on 28P01. A failed sync leaves this
    #    container running; it just stays unhealthy.
    #
    # The ALTER is fed to psql on STDIN, not via -c. psql only interpolates
    # :'pw' in input it parses itself; with -c the literal `:'pw'` reaches the
    # server and is rejected as a syntax error. Do not "tidy" this into a -c.
    # The :'pw' form is also what keeps a password containing a quote safe.
    command:
      - sh
      - -c
      - |
        (
          sleep 5
          ready=no
          i=0
          while [ $$i -lt 60 ]; do
            if pg_isready -q -h /var/run/postgresql -U "$$POSTGRES_USER"; then
              ready=yes
              break
            fi
            i=$$((i + 1))
            sleep 1
          done
          if [ "$$ready" != yes ]; then
            echo "password-sync: postgres never became ready; skipped." >&2
          elif [ -z "$$POSTGRES_PASSWORD" ]; then
            echo "password-sync: POSTGRES_PASSWORD is empty; skipped." >&2
          else
            i=0
            while [ $$i -lt 12 ]; do
              if printf "%s\n" "ALTER USER CURRENT_USER WITH PASSWORD :'pw';" \
                | psql -q -v ON_ERROR_STOP=1 -v pw="$$POSTGRES_PASSWORD" \
                       -h /var/run/postgresql -U "$$POSTGRES_USER" -d postgres
              then
                echo "password-sync: POSTGRES_PASSWORD applied to role $$POSTGRES_USER." >&2
                break
              fi
              i=$$((i + 1))
              if [ $$i -lt 12 ]; then
                echo "password-sync: ALTER USER attempt $$i failed; retrying." >&2
                sleep 5
              fi
            done
            if [ $$i -ge 12 ]; then
              echo "password-sync: ALTER USER failed; cluster password left unchanged." >&2
              echo "password-sync: reset it by hand -- docs/runbooks/postgres-auth-failure.md" >&2
            fi
          fi
        ) &
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equijournal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - internal
    healthcheck:
      # pg_isready does not check the password. Require the same TCP login the
      # API uses, and expand the secret at runtime ($$) so Compose does not
      # bake it into the check command. api waits on service_healthy.
      test:
        - CMD-SHELL
        - 'pg_isready -q -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && PGPASSWORD="$$POSTGRES_PASSWORD" psql -q -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "SELECT 1" >/dev/null'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit_data:/data
    networks:
      - internal

  minio:
    # minio/minio is no longer published; coollabsio rebuilds official releases.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done &&
      mc mb -p local/${STORAGE_BUCKET:-equine-attachments} || true &&
      exit 0
      "
    networks:
      - internal

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  mailpit_data:
  api_logs:
  api_dataprotection:
