# Optional overlay for a self-managed Postgres compose service.
# Dokploy's default Postgres app may not accept this file — see docs/runbooks/backup.md.
# archive_command is an example; install rclone on the database container/host first.

wal_level = replica
archive_mode = on
archive_command = 'rclone copy %p :s3:YOUR_BUCKET/equine/wal/%f --s3-no-check-bucket'
archive_timeout = 300
